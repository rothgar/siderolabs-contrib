# DeepSeek-V4-Flash-0731 served across 2 sparks (tp=2, one GB10 per rank)
# via a LeaderWorkerSet. Uses eugr's spark-vllm-b12x image (Blackwell 12x
# fast-path build of vLLM) — see
# https://github.com/eugr/spark-vllm-docker for the recipe.
#
# Before syncing:
#   1. Create the huggingface-token secret (or replace HF_TOKEN with a raw
#      value in the env below):
#        kubectl -n inference create secret generic huggingface-token \
#          --from-literal=token=hf_...
#   2. If your gpu-rdma ResourceClaimTemplate uses a different name or
#      isn't in `inference`, update the reference below.
#   3. The leader is pinned to gb10-a and worker to gb10-b via nodeSelector
#      (matches hostname in patches/spark-{a,b}.yaml). Change hostnames if
#      you renamed the sparks.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-example
  namespace: inference
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: vllm-example
          app.kubernetes.io/component: leader
      spec:
        runtimeClassName: nvidia
        nodeSelector:
          kubernetes.io/hostname: gb10-a
        dnsConfig:
          options:
            - name: ndots
              value: "1"
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        containers:
          - name: vllm
            image: docker.io/eugr/spark-vllm-b12x:nightly-20260810
            command: [bash, -c]
            args:
              - |
                exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
                  --served-model-name deepseek-v4-flash-0731 \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --pipeline-parallel-size 1 \
                  --nnodes 2 \
                  --node-rank 0 \
                  --master-addr ${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --kv-cache-dtype fp8 \
                  --block-size 256 \
                  --max-model-len 524288 \
                  --max-num-seqs 8 \
                  --max-num-batched-tokens 8192 \
                  --gpu-memory-utilization 0.85 \
                  --enable-prefix-caching \
                  --tokenizer-mode deepseek_v4 \
                  --tool-call-parser deepseek_v4 \
                  --enable-auto-tool-choice \
                  --reasoning-parser deepseek_v4 \
                  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
                  --default-chat-template-kwargs.thinking=true \
                  --default-chat-template-kwargs.reasoning_effort=high \
                  --load-format auto \
                  --moe-backend b12x \
                  --linear-backend b12x \
                  --attention-backend B12X_MLA_SPARSE \
                  --max-cudagraph-capture-size 64 \
                  --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
                  --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}'
            env:
              - name: HF_HOME
                value: /models
              - name: DO_NOT_TRACK
                value: "1"
              # B12X fast-path env from the eugr recipe.
              - name: CUTE_DSL_ARCH
                value: sm_121a
              - name: VLLM_USE_AOT_COMPILE
                value: "1"
              - name: VLLM_USE_BREAKABLE_CUDAGRAPH
                value: "0"
              - name: VLLM_USE_MEGA_AOT_ARTIFACT
                value: "-1"
              - name: VLLM_MEMORY_PROFILE_INCLUDE_ATTN
                value: "1"
              - name: VLLM_USE_FLASHINFER_SAMPLER
                value: "1"
              - name: VLLM_USE_B12X_WO_PROJECTION
                value: "1"
              - name: VLLM_USE_B12X_MHC
                value: "1"
              - name: VLLM_USE_B12X_FP8_GEMM
                value: "1"
              - name: VLLM_USE_B12X_MOE
                value: "1"
              - name: VLLM_USE_B12X_SPARSE_INDEXER
                value: "1"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: B12X_MLA_SM120_UNIFIED
                value: "1"
              - name: B12X_MOE_FORCE_A8
                value: "1"
              # NCCL over CX-7 RoCEv2 via mlx5_0 (the pci0000 card).
              - name: NCCL_IB_HCA
                value: "=mlx5_0:1"
              - name: NCCL_IB_GID_INDEX
                value: "1"
              # Generous QP retransmit timeout (~17s) so transient stalls on
              # a direct cable don't escalate to RETRY_EXC_ERR.
              - name: NCCL_IB_TIMEOUT
                value: "22"
              # eth0 (CNI) carries only rendezvous; collectives go over IB.
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_DEBUG
                value: INFO
              - name: VLLM_LOGGING_LEVEL
                value: DEBUG
              - name: PYTHONUNBUFFERED
                value: "1"
              # 1h engine init cap for cold-start torch.compile + AOT.
              - name: VLLM_ENGINE_INIT_TIMEOUT_S
                value: "3600"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: huggingface-token
                    key: token
              - name: HF_HUB_DISABLE_XET
                value: "1"
            ports:
              - containerPort: 8000
                name: http
              - containerPort: 29500
                name: dist-coord
            startupProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              # Cold-start pulls weights + does AOT compile. ~2h upper bound.
              failureThreshold: 720
            livenessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts:
              - name: models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: models
            hostPath:
              path: /var/mnt/models
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: vllm-example
          app.kubernetes.io/component: worker
      spec:
        runtimeClassName: nvidia
        nodeSelector:
          kubernetes.io/hostname: gb10-b
        dnsConfig:
          options:
            - name: ndots
              value: "1"
        resourceClaims:
          - name: gpu-rdma
            resourceClaimTemplateName: gpu-rdma
        containers:
          - name: vllm
            image: docker.io/eugr/spark-vllm-b12x:nightly-20260810
            command: [bash, -c]
            args:
              - |
                exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
                  --served-model-name deepseek-v4-flash-0731 \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --trust-remote-code \
                  --tensor-parallel-size 2 \
                  --pipeline-parallel-size 1 \
                  --nnodes 2 \
                  --node-rank 1 \
                  --master-addr ${LWS_LEADER_ADDRESS} \
                  --master-port 29500 \
                  --headless \
                  --kv-cache-dtype fp8 \
                  --block-size 256 \
                  --max-model-len 524288 \
                  --max-num-seqs 8 \
                  --max-num-batched-tokens 8192 \
                  --gpu-memory-utilization 0.85 \
                  --enable-prefix-caching \
                  --tokenizer-mode deepseek_v4 \
                  --tool-call-parser deepseek_v4 \
                  --enable-auto-tool-choice \
                  --reasoning-parser deepseek_v4 \
                  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
                  --default-chat-template-kwargs.thinking=true \
                  --default-chat-template-kwargs.reasoning_effort=high \
                  --load-format auto \
                  --moe-backend b12x \
                  --linear-backend b12x \
                  --attention-backend B12X_MLA_SPARSE \
                  --max-cudagraph-capture-size 64 \
                  --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
                  --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}'
            env:
              - name: HF_HOME
                value: /models
              - name: DO_NOT_TRACK
                value: "1"
              - name: CUTE_DSL_ARCH
                value: sm_121a
              - name: VLLM_USE_AOT_COMPILE
                value: "1"
              - name: VLLM_USE_BREAKABLE_CUDAGRAPH
                value: "0"
              - name: VLLM_USE_MEGA_AOT_ARTIFACT
                value: "-1"
              - name: VLLM_MEMORY_PROFILE_INCLUDE_ATTN
                value: "1"
              - name: VLLM_USE_FLASHINFER_SAMPLER
                value: "1"
              - name: VLLM_USE_B12X_WO_PROJECTION
                value: "1"
              - name: VLLM_USE_B12X_MHC
                value: "1"
              - name: VLLM_USE_B12X_FP8_GEMM
                value: "1"
              - name: VLLM_USE_B12X_MOE
                value: "1"
              - name: VLLM_USE_B12X_SPARSE_INDEXER
                value: "1"
              - name: VLLM_USE_V2_MODEL_RUNNER
                value: "1"
              - name: B12X_MLA_SM120_UNIFIED
                value: "1"
              - name: B12X_MOE_FORCE_A8
                value: "1"
              - name: NCCL_IB_HCA
                value: "=mlx5_0:1"
              - name: NCCL_IB_GID_INDEX
                value: "1"
              - name: NCCL_IB_TIMEOUT
                value: "22"
              - name: NCCL_SOCKET_IFNAME
                value: eth0
              - name: NCCL_DEBUG
                value: INFO
              - name: VLLM_LOGGING_LEVEL
                value: DEBUG
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: VLLM_ENGINE_INIT_TIMEOUT_S
                value: "3600"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: huggingface-token
                    key: token
              - name: HF_HUB_DISABLE_XET
                value: "1"
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            resources:
              claims:
                - name: gpu-rdma
            volumeMounts:
              - name: models
                mountPath: /models
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: models
            hostPath:
              path: /var/mnt/models
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-example
  namespace: inference
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vllm-example
    app.kubernetes.io/component: leader
  ports:
    - name: http
      port: 8000
      targetPort: http
