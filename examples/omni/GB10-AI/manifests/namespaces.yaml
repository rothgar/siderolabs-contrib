---
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# Dedicated namespace for the vLLM workload. Uses IPC_LOCK (RDMA memory
# pinning) and hostPath (models UserVolume) — both rejected at the `baseline`
# PSA level Talos ships by default, so this namespace is labeled `privileged`.
# Kept separate from `default` so unrelated workloads don't inherit it.
apiVersion: v1
kind: Namespace
metadata:
  name: inference
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: lws-system
